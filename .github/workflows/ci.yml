name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Check out the qualified discovery provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: datacore-one/datacore
          ref: 7c1c197ad876247e31cb9cb4bf2f478ec85b1d4e
          path: .core-test
          persist-credentials: false

      - name: Prepare isolated discovery runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/datacore-test-python"
          "$RUNNER_TEMP/datacore-test-python/bin/python" -m pip install --require-hashes --no-deps -r scripts/requirements-core-tests.txt
          echo "DATACORE_LIB=$GITHUB_WORKSPACE/.core-test/.datacore/lib" >> "$GITHUB_ENV"
          echo "DATACORE_PYTHON=$RUNNER_TEMP/datacore-test-python/bin/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Verify types, tests and the built MCP protocol
        run: |
          ./node_modules/.bin/tsc --noEmit
          npm run verify
